# ==============================================================================
# CERBERUS DevSecOps — Checkov IaC Security Configuration
# ==============================================================================
# Ce fichier définit les politiques de sécurité IaC pour le projet CERBERUS.
# Les règles exclues concernent les options multi-régions/KMS payantes non applicables
# au cluster de dev/test, et sont toutes documentées dans docs/SECURITY_REPORT_CERBERUS.md
# ==============================================================================

directory:
  - terraform

# Ignorer les règles d'architecture multi-régions et KMS payantes pour le cluster Dev
skip-check:
  - CKV_AZURE_165  # ACR Geo-replication (Option Multi-Régions payante)
  - CKV_AZURE_233  # ACR Zone redundancy (Option Premium payante)
  - CKV_AZURE_139  # ACR Public Network Access (Requis pour push/pull sans VNet privé)
  - CKV_AZURE_163  # ACR Vulnerability Scanning via Defender (Nécessite abonnement Premium)
  - CKV_AZURE_164  # ACR Image Trust/Content Trust (Remplacé dans CERBERUS par Cosign/Sigstore!)
  - CKV_AZURE_166  # ACR Quarantine policy (Nécessite Premium SKU)
  - CKV_AZURE_167  # ACR Retention Policy (Nécessite Premium SKU)
  - CKV_AZURE_237  # ACR Dedicated Data Endpoints (Nécessite Premium SKU)
  - CKV_AZURE_115  # AKS Private Cluster (Requis uniquement sur VNet d'entreprise avec VPN)
  - CKV_AZURE_6    # AKS Authorized IP Ranges (Cluster Dev accessible depuis nos IP)
  - CKV_AZURE_117  # AKS Disk Encryption Set (Nécessite un Key Vault KMS payant)
  - CKV_AZURE_227  # AKS Temp Disk Encryption (Nécessite VM SKU spécifiques)
  - CKV_AZURE_226  # AKS Ephemeral OS Disk (Nécessite VM SKU d'entreprise)
  - CKV_AZURE_170  # AKS Paid SLA (Nécessite abonnement commercial)
  - CKV_AZURE_4    # AKS Azure Monitor Logging (Nécessite Workspace Log Analytics payant)
  - CKV_AZURE_168  # AKS Minimum 50 pods (Non applicable sur 1 seul node de dev)
  - CKV_AZURE_7    # AKS Network Policy (Sera implémenté via manifeste K8s nativement)
  - CKV_AZURE_232  # AKS System Nodes Taints (Nécessite au moins 2 node pools)
  - CKV_AZURE_172  # Secrets Store CSI Auto-rotation (Nécessite Azure Key Vault CSI Addon)
